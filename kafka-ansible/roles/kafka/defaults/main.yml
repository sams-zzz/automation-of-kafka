kafka_version: "3.9.0"
kafka_scala_version: "2.13"

kafka_base_image: "eclipse-temurin:21-jre-jammy"
kafka_image_name: "local/kafka"
kafka_image_tag: "3.9.0-training"

kafka_container_name: "kafka-1"
kafka_network_name: "kafka-network"
kafka_volume_name: "kafka-data"

kafka_host_port: 9092
kafka_container_port: 9092
kafka_controller_port: 9093

kafka_broker_id: 1
kafka_cluster_id: "MkU3OEVBNTcwNTJENDM2Qk"

kafka_process_roles: "broker,controller"
kafka_num_partitions: 1
kafka_default_replication_factor: 1
kafka_auto_create_topics: false
kafka_log_retention_hours: 168

# Variables utilisées par les templates et les tâches
kafka_download_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
kafka_user: "kafka"
kafka_home: "/opt/kafka"
kafka_data_dir: "/var/lib/kafka/data"
kafka_restart_policy: "unless-stopped"
kafka_build_dir: "{{ playbook_dir | dirname }}/build"
kafka_config_dir: "{{ kafka_build_dir }}/{{ kafka_container_name }}"
