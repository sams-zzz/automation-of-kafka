---
all:
  children:
    kafka_brokers:
      hosts:
        kafka-1:
          kafka_broker_id: 1
          kafka_host_port: 9092
        kafka-2:
          kafka_broker_id: 2
          kafka_host_port: 9093
        kafka-3:
          kafka_broker_id: 3
          kafka_host_port: 9094
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        kafka_container_name: "{{ inventory_hostname }}"
        kafka_volume_name: "kafka-data-{{ inventory_hostname }}"
        kafka_network_name: "kafka-network"
        kafka_container_port: 9092
        kafka_controller_port: 9093
        kafka_internal_port: 19092
        kafka_num_partitions: 3
        kafka_default_replication_factor: 3